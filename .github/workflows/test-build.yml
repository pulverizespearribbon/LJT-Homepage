name: Test Jekyll Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify generated site
        run: |
          echo "=== Generated HTML files ==="
          find _site -name "*.html" | sort
          echo "=== index.html title ==="
          grep -o "<title>[^<]*</title>" _site/index.html || true
          echo "=== index.html key checks ==="
          for s in "Junteng Liu" "first-year PhD candidate at the HKUST NLP Group" "Shanghai Jiao Tong University" "LLM Reasoning and Reinforcement Learning" "Hallucination in Vision-Language Models" "LLM Truthfulness and Interpretability" "MINIMAX" "Tencent WXG" "Shanghai AI Lab" "Zhiyuan Honor Scholarship" "jliugi@connect.ust.hk" "Vicent0205" "junteng88716710" "SynLogic" "Perception Bottleneck" "Universal Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient Modules"; do
            if grep -q "$s" _site/index.html; then echo "FOUND: $s"; else echo "MISSING: $s"; fi
          done
          echo "=== publications page checks ==="
          for s in "SynLogic" "Perception Bottleneck" "Universal Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient Modules"; do
            if grep -q "$s" _site/publications/index.html; then echo "FOUND: $s"; else echo "MISSING: $s"; fi
          done
          echo "=== publication detail pages ==="
          for f in _site/publication/*/index.html; do echo "--- $f"; grep -o "<title>[^<]*</title>" "$f" || true; done
